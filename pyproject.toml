[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regime-detection"
version = "0.1.0"
description = "Regime-conditional VaR/CVaR for energy markets"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "requests",
    "fredapi",
    "python-dotenv",
    "statsmodels",
    "scikit-learn",
    "streamlit",
    "matplotlib",
    "seaborn",
    # used by scripts/build_meeting_dates.py to scrape FOMC/OPEC calendars
    "cloudscraper",
    "beautifulsoup4",
    "ruptures",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "black", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]
